<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My CI/CD App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(to right, #1f4037, #99f2c8);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
    }

    .container {
      text-align: center;
      background: rgba(0,0,0,0.6);
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    h1 {
      font-size: 40px;
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
      margin-bottom: 20px;
    }

    .btn {
      padding: 12px 25px;
      background: #00c9a7;
      border: none;
      border-radius: 25px;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      background: #00a78e;
    }

    footer {
      margin-top: 20px;
      font-size: 14px;
      opacity: 0.8;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🚀 CI/CD Pipeline Live</h1>
    <p>Deployed automatically using Jenkins</p>

    <button class="btn" onclick="showMessage()">Check Status</button>

    <p id="msg"></p>

    <footer>
      Hosted on AWS EC2 | Auto Deploy Enabled
    </footer>
  </div>

  <script>
    function showMessage() {
      document.getElementById("msg").innerText = "✅ Deployment Successful!";
    }
  </script>
</body>
</html>
